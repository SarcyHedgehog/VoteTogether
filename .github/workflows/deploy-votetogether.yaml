name: Deploy VoteTogether to sarcastichedgehog.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out VoteTogether
        uses: actions/checkout@v6

      - name: Create Photon production configuration
        run: |
          cat > config.js <<EOF
          window.APP_CONFIG = {
            MODE: "photon",
            PHOTON_APP_ID: "${{ secrets.PHOTON_APP_ID }}",
            PHOTON_REGION: "eu",
            PHOTON_SDK_URL: "vendor/photon.min.js",
            BASE_URL: "https://www.sarcastichedgehog.com/votetogether/",
            DEBUG: false
          };
          EOF

      - name: Check out website repository
        uses: actions/checkout@v6
        with:
          repository: SarcyHedgehog/sarcastichedgehog.com
          path: website_repo
          token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}

      - name: Replace published VoteTogether files
        shell: bash
        run: |
          TARGET_DIR="./website_repo/votetogether"
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"

          cp index.html manifest.json sw.js config.js config.example.js README.md CHANGELOG.md legacy-multisynq.html "$TARGET_DIR/"
          cp -r icons src tutorial vendor "$TARGET_DIR/"

      - name: Commit website update
        shell: bash
        run: |
          cd website_repo
          if [[ -z $(git status --porcelain) ]]; then
            echo "No changes to deploy."
            exit 0
          fi
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add --all votetogether
          git commit -m "Deploy Photon VoteTogether from VoteTogether repository"
          git push origin main
